services:
  - type: web
    name: instora-backend
    runtime: docker
    rootDir: backend
    dockerfilePath: Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: PORT
        value: "8000"
      - key: GEMINI_API_KEY
        sync: false
      - key: BUFFER_ACCESS_TOKEN
        sync: false
      - key: BUFFER_CHANNEL_ID
        sync: false
      - key: BUFFER_ORGANIZATION_ID
        sync: false
      - key: GDRIVE_FOLDER_ID
        sync: false

  - type: web
    name: instora-frontend
    runtime: node
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm run start -- -p $PORT -H 0.0.0.0
    plan: free
    region: oregon
    envVars:
      - key: NODE_ENV
        value: production
      - key: BACKEND_URL
        sync: false
